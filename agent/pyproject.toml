# this is like the package.json but for a python project in uv
[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "cuid>=0.4",
    "fastmcp>=4.0.5",
    "jupyterlab>=4.6.4",
    "pydantic-ai>=2.50.0",
    "pydantic-ai-slim[mcp]>=2.50.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.0.54",
]

# uv add:
# Updates pyproject.toml
# Resolves the dependency
# Updates uv.lock
# Makes the dependency available to the project environment

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
flightagent-mcp = "flightagent_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightagent_agent", "src/flightagent_mcp"]

[tool.uv]
package = true
